name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 2
      - name: Check for landing-page changes
        id: changes
        run: |
          # For pull requests, check changed files in the PR
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^apps/landing-page/'; then
              echo "landing_page_changed=true" >> $GITHUB_OUTPUT
            else
              echo "landing_page_changed=false" >> $GITHUB_OUTPUT
            fi
          # For pushes (including merged PRs), check the last commit
          else
            if git diff --name-only HEAD~1 HEAD | grep -q '^apps/landing-page/'; then
              echo "landing_page_changed=true" >> $GITHUB_OUTPUT
            else
              echo "landing_page_changed=false" >> $GITHUB_OUTPUT
            fi
          fi
      - name: Display deployment status
        run: |
          if [ "${{ steps.changes.outputs.landing_page_changed }}" = "true" ]; then
            echo "✅ Landing page changes detected - deployment will occur after merge to main"
          else
            echo "ℹ️ No landing page changes - deployment will be skipped"
          fi
      - name: Git config user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-node@v3
        with:
          node-version: 22.21.1
      - name: Verify Change Logs
        run: node ./common/scripts/install-run-rush.js change --verify
      - name: Rush Install
        run: node ./common/scripts/install-run-rush.js install
      - name: Rush rebuild
        run: node ./common/scripts/install-run-rush.js rebuild --verbose
      - name: Setup Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.changes.outputs.landing_page_changed == 'true'
        uses: actions/configure-pages@v4
      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.changes.outputs.landing_page_changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./apps/landing-page/dist
      - name: Deploy to GitHub Pages
        id: deployment
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.changes.outputs.landing_page_changed == 'true'
        uses: actions/deploy-pages@v4
